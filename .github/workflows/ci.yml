name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.26.3'

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: |
          bad="$(gofmt -l -s .)"
          if [ -n "$bad" ]; then
            echo "::error::Run gofmt -w -s on these files:"
            echo "$bad"
            exit 1
          fi
      - name: goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          bad="$(goimports -l -local github.com/Tsukikage7/servex/v2 .)"
          if [ -n "$bad" ]; then
            echo "::error::Run goimports -w -local github.com/Tsukikage7/servex/v2 on these files:"
            echo "$bad"
            exit 1
          fi

  deps:
    name: Dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - ./cmd/servex
          - ./llm/adapter/eino
          - ./llm/adapter/adk
          - ./testx/container
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go mod tidy
        run: |
          cd "${{ matrix.module }}"
          go mod tidy
      - name: Ensure go.mod/go.sum are tidy
        run: git diff --exit-code -- go.mod go.sum go.work go.work.sum '**/go.mod' '**/go.sum'

  boundary:
    name: Dependency Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Check root package boundaries
        run: ./scripts/check-deps.sh

  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - ./cmd/servex
          - ./llm/adapter/eino
          - ./llm/adapter/adk
          - ./testx/container
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test
        run: |
          cd "${{ matrix.module }}"
          go test -race -count=1 ./...

  vet:
    name: Vet (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - ./cmd/servex
          - ./llm/adapter/eino
          - ./llm/adapter/adk
          - ./testx/container
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: |
          cd "${{ matrix.module }}"
          go vet ./...

  build:
    name: Build (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - ./cmd/servex
          - ./llm/adapter/eino
          - ./llm/adapter/adk
          - ./testx/container
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go build
        run: |
          cd "${{ matrix.module }}"
          go build ./...

  vuln:
    name: Vulnerability Check (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - ./cmd/servex
          - ./llm/adapter/eino
          - ./llm/adapter/adk
          - ./testx/container
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck
        run: |
          cd "${{ matrix.module }}"
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: servex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      elasticsearch:
        image: elasticsearch:8.17.4
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Wait for services
        run: |
          for i in $(seq 1 30); do nc -z localhost 6379 && break || sleep 1; done
          for i in $(seq 1 30); do nc -z localhost 5432 && break || sleep 1; done
          for i in $(seq 1 30); do nc -z localhost 27017 && break || sleep 1; done
          for i in $(seq 1 60); do curl -sf http://localhost:9200/_cluster/health && break || sleep 2; done
      - name: Run integration tests
        env:
          REDIS_ADDR: localhost:6379
          POSTGRES_DSN: "host=localhost port=5432 user=test password=test dbname=servex_test sslmode=disable"
          MONGO_URI: mongodb://localhost:27017
          ES_ADDRESSES: http://localhost:9200
        run: go test -race -count=1 -tags=integration ./tests/integration/...

  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [format, deps, boundary, test, vet, build, vuln, integration]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.format.result }}" != "success" ] || \
             [ "${{ needs.deps.result }}" != "success" ] || \
             [ "${{ needs.boundary.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.vet.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.vuln.result }}" != "success" ]; then
            echo "::error::One or more required CI jobs failed"
            exit 1
          fi
          if [ "${{ needs.integration.result }}" != "success" ]; then
            echo "::warning::Integration tests are non-blocking and ended with ${{ needs.integration.result }}"
          fi
          echo "All required CI checks passed"
