syntax = "proto3";

package api.user.v1;

option go_package = "github.com/Tsukikage7/servex/examples/ecommerce/api/user/v1;userv1";

// UserService 用户服务.
service UserService {
  // CreateUser 创建用户.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

  // GetUser 查询用户.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // ListUsers 查询用户列表.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
}

message CreateUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message CreateUserResponse {
  uint64 id = 1;
  string username = 2;
  string email = 3;
}

message GetUserRequest {
  uint64 id = 1;
}

message GetUserResponse {
  uint64 id = 1;
  string username = 2;
  string email = 3;
  string created_at = 4;
  string updated_at = 5;
}

message ListUsersRequest {
  int32 offset = 1;
  int32 limit = 2;
}

message ListUsersResponse {
  repeated GetUserResponse users = 1;
  int64 total = 2;
}
